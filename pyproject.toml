[project]
name = "emporio-agent"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música (desafio técnico AI Engineer)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
emporio-agent = "emporio_agent:main"
emporio-web = "emporio_agent.web:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
