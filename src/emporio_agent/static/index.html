<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empório da Música · Atendimento</title>
<style>
  :root {
    --page-bg: #e9edef;
    --bezel: #111;
    --header: #f6f6f6;
    --chat-bg: #efeae2;
    --dot: rgba(0, 0, 0, 0.035);
    --in: #ffffff;
    --out: #d9fdd3;
    --text: #111b21;
    --muted: #667781;
    --accent: #00a884;
    --tick: #53bdeb;
    --tool-bg: #fff6d6;
    --tool-text: #6b5a1e;
    --chip-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px 16px;
    background: radial-gradient(circle at 30% 20%, #ffffff 0%, var(--page-bg) 60%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
  }

  /* ---------- Phone frame ---------- */
  .phone {
    position: relative;
    width: 390px;
    height: 844px;
    max-height: calc(100vh - 110px);
    min-height: 600px;
    border-radius: 58px;
    padding: 12px;
    background: var(--bezel);
    box-shadow:
      0 0 0 2px #2b2b2b,
      0 30px 60px -20px rgba(0, 0, 0, 0.45),
      0 18px 36px -18px rgba(0, 0, 0, 0.35);
  }
  .phone::before, .phone::after {
    content: "";
    position: absolute;
    left: -4px;
    width: 4px;
    border-radius: 2px 0 0 2px;
    background: #2b2b2b;
  }
  .phone::before { top: 160px; height: 60px; }
  .phone::after { top: 235px; height: 60px; }
  .screen {
    position: relative;
    height: 100%;
    border-radius: 46px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--chat-bg);
  }
  .island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 122px;
    height: 35px;
    border-radius: 20px;
    background: #000;
    z-index: 5;
  }

  /* ---------- Status bar + header ---------- */
  .top { background: var(--header); border-bottom: 1px solid #e3e3e3; }
  .status {
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 30px 0 40px;
    font-size: 16px;
    font-weight: 600;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .chat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 14px 10px 8px;
  }
  .back { color: #007aff; display: flex; align-items: center; }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #7a4b2a, #b07a45);
    color: #fff;
    font-size: 19px;
    flex-shrink: 0;
  }
  .contact { flex: 1; min-width: 0; }
  .contact-name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contact-status { font-size: 12.5px; color: var(--muted); height: 16px; }
  .contact-status.typing { color: var(--accent); }
  .header-icons { display: flex; gap: 20px; color: #007aff; }

  /* ---------- Chat ---------- */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px 12px 6px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    background-color: var(--chat-bg);
    background-image: radial-gradient(var(--dot) 1.5px, transparent 1.5px);
    background-size: 18px 18px;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 0; }
  .day-chip, .notice {
    align-self: center;
    margin: 6px 0 8px;
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 12px;
    background: var(--chip-bg);
    color: var(--muted);
    box-shadow: 0 1px 0.5px rgba(0, 0, 0, 0.1);
  }
  .notice { background: #fff8c4; color: #54656f; max-width: 88%; text-align: center; line-height: 1.35; }
  .msg {
    position: relative;
    max-width: 82%;
    padding: 6px 8px 8px 9px;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1.38;
    box-shadow: 0 1px 0.5px rgba(0, 0, 0, 0.13);
    word-wrap: break-word;
    animation: pop 0.18s ease-out;
  }
  .msg.in { align-self: flex-start; background: var(--in); border-top-left-radius: 0; }
  .msg.out { align-self: flex-end; background: var(--out); border-top-right-radius: 0; }
  .msg.in::before, .msg.out::before {
    content: "";
    position: absolute;
    top: 0;
    width: 8px;
    height: 13px;
  }
  .msg.in::before { left: -8px; background: linear-gradient(to bottom left, var(--in) 50%, transparent 50%); }
  .msg.out::before { right: -8px; background: linear-gradient(to bottom right, var(--out) 50%, transparent 50%); }
  .msg + .msg.in::before, .msg.out + .msg.out::before { display: none; }
  .msg.in + .msg.in, .msg.out + .msg.out { border-radius: 8px; }
  .msg.in:not(:first-child) { margin-top: 0; }
  .msg .meta {
    float: right;
    margin: 6px 0 -4px 10px;
    font-size: 11px;
    color: var(--muted);
    display: inline-flex;
    gap: 3px;
    align-items: center;
  }
  .msg .ticks { color: #8696a0; }
  .msg .ticks.read { color: var(--tick); }
  .msg.in + .msg.out, .msg.out + .msg.in, .tool + .msg, .msg + .tool { margin-top: 6px; }
  .tool {
    align-self: center;
    max-width: 92%;
    padding: 4px 10px;
    border-radius: 7px;
    background: var(--tool-bg);
    color: var(--tool-text);
    font: 11.5px/1.35 ui-monospace, "SF Mono", Menlo, monospace;
    word-break: break-all;
    display: none;
  }
  .show-tools .tool { display: block; }
  .typing-bubble {
    align-self: flex-start;
    background: var(--in);
    border-radius: 8px;
    border-top-left-radius: 0;
    padding: 12px 14px;
    display: none;
    gap: 4px;
    margin-top: 6px;
    box-shadow: 0 1px 0.5px rgba(0, 0, 0, 0.13);
  }
  .typing-bubble.on { display: flex; }
  .typing-bubble span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #9aa5ab;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ---------- Suggestions + composer ---------- */
  .suggestions {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 6px 10px;
    background: var(--chat-bg);
  }
  .suggestions::-webkit-scrollbar { height: 0; }
  .suggestions button {
    flex-shrink: 0;
    border: 1px solid #d1d7db;
    background: #fff;
    color: #008069;
    border-radius: 16px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .suggestions button:hover { background: #f0faf7; }
  .composer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px 30px;
    background: var(--header);
    border-top: 1px solid #e3e3e3;
  }
  .composer .plus { color: #007aff; display: flex; }
  .composer input {
    flex: 1;
    min-width: 0;
    border: 1px solid #e0e0e0;
    border-radius: 18px;
    padding: 9px 14px;
    font-size: 15px;
    outline: none;
    background: #fff;
    color: var(--text);
  }
  .composer input:focus { border-color: #c5ccd0; }
  .send {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .send:disabled { background: #b8c4c9; cursor: default; }
  .home-bar {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    border-radius: 3px;
    background: #111;
  }

  /* ---------- Controls below the phone ---------- */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #3b4a54;
  }
  .controls label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .controls button {
    border: 1px solid #c9d1d5;
    background: #fff;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
    color: #3b4a54;
  }
  .model { color: #8696a0; font-size: 12px; }

  @media (max-width: 480px) {
    body { padding: 0; gap: 0; justify-content: flex-start; }
    .phone { width: 100%; height: 100vh; max-height: none; min-height: 0; border-radius: 0; padding: 0; box-shadow: none; }
    .phone::before, .phone::after, .island, .home-bar { display: none; }
    .screen { border-radius: 0; }
    .status { display: none; }
    .chat-header { padding-top: 10px; }
    .composer { padding-bottom: 12px; }
    .controls { padding: 10px 16px; }
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="screen" id="screen">
      <div class="island"></div>
      <div class="top">
        <div class="status">
          <span id="clock">9:41</span>
          <span class="status-icons" aria-hidden="true">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#111"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#111"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#111"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#111"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0L8 11.5Zm-4.3-4.4L2 5.4a8.5 8.5 0 0 1 12 0l-1.7 1.7a6 6 0 0 0-8.6 0ZM.3 3.7 0 3.4l-.1-.1a11 11 0 0 1 16.2 0l-1.8 1.8a8.6 8.6 0 0 0-12.6 0L.3 3.7Z" fill="#111"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#111" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#111"/><rect x="24.5" y="4.5" width="2" height="4" rx="1" fill="#111" opacity=".4"/></svg>
          </span>
        </div>
        <div class="chat-header">
          <span class="back" aria-hidden="true">
            <svg width="12" height="20" viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <div class="avatar" aria-hidden="true">🎸</div>
          <div class="contact">
            <div class="contact-name">Empório da Música</div>
            <div class="contact-status" id="contact-status">online</div>
          </div>
          <div class="header-icons" aria-hidden="true">
            <svg width="24" height="16" viewBox="0 0 24 16"><rect x="1" y="1.5" width="15" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 6.5 6-3.5v10l-6-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <svg width="20" height="20" viewBox="0 0 20 20"><path d="M5.3 1.5 7.8 4c.6.6.6 1.5.1 2.1L6.6 7.6a11 11 0 0 0 5.8 5.8l1.5-1.3c.6-.5 1.5-.5 2.1.1l2.5 2.5c.6.6.6 1.6 0 2.2l-1.3 1.3c-1 1-2.6 1.3-3.9.7A19 19 0 0 1 1.1 6.7C.5 5.4.8 3.8 1.8 2.8L3.1 1.5c.6-.6 1.6-.6 2.2 0Z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
          </div>
        </div>
      </div>

      <div class="chat" id="chat">
        <div class="day-chip">Hoje</div>
        <div class="notice">Você está conversando com o assistente virtual da Empório da Música. Preços, estoque e pedidos são consultados no sistema da loja.</div>
        <div class="typing-bubble" id="typing"><span></span><span></span><span></span></div>
      </div>

      <div class="suggestions" id="suggestions">
        <button>Violões até R$ 1.000</button>
        <button>Quanto custa o Takamine GD20?</button>
        <button>Me arrependi da compra, posso devolver?</button>
        <button>Vocês vendem cordas?</button>
        <button>Vocês estão abertos agora?</button>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <span class="plus" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 3v16M3 11h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </span>
        <input id="input" type="text" placeholder="Mensagem" maxlength="2000" aria-label="Mensagem">
        <button class="send" id="send" type="submit" aria-label="Enviar">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z" fill="currentColor"/></svg>
        </button>
      </form>
      <div class="home-bar"></div>
    </div>
  </div>

  <div class="controls">
    <label><input type="checkbox" id="show-tools"> Mostrar ferramentas chamadas</label>
    <button id="reset" type="button">Nova conversa</button>
    <span class="model" id="model"></span>
  </div>

<script>
  const chat = document.getElementById("chat");
  const typing = document.getElementById("typing");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const statusLine = document.getElementById("contact-status");
  const suggestions = document.getElementById("suggestions");
  const modelLabel = document.getElementById("model");
  let session = newSession();
  let busy = false;

  function newSession() {
    return (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) + Math.random();
  }

  function hhmm(date = new Date()) {
    return date.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }

  function tickClock() {
    document.getElementById("clock").textContent = hhmm().replace(/^0/, "");
  }
  tickClock();
  setInterval(tickClock, 15000);

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // WhatsApp-style formatting: *bold*, _italic_, "- " bullet lines.
  function format(text) {
    return escapeHtml(text)
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*\n]+)\*/g, "<strong>$1</strong>")
      .replace(/(^|\s)_([^_\n]+)_(?=\s|$)/g, "$1<em>$2</em>")
      .replace(/^- /gm, "• ")
      .replace(/\n/g, "<br>");
  }

  function addMessage(text, side) {
    const bubble = document.createElement("div");
    bubble.className = `msg ${side}`;
    const ticks = side === "out"
      ? '<span class="ticks"><svg width="16" height="11" viewBox="0 0 16 11"><path d="M1 6l3 3 6-7M6 9l1 1 7-8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
      : "";
    bubble.innerHTML = `${format(text)}<span class="meta">${hhmm()}${ticks}</span>`;
    chat.insertBefore(bubble, typing);
    scrollDown();
    return bubble;
  }

  function addTool(call) {
    const note = document.createElement("div");
    note.className = "tool";
    note.textContent = `🔧 ${call.name}(${JSON.stringify(call.args)})`;
    chat.insertBefore(note, typing);
  }

  function scrollDown() {
    chat.scrollTop = chat.scrollHeight;
  }

  function setTyping(on) {
    typing.classList.toggle("on", on);
    statusLine.textContent = on ? "digitando..." : "online";
    statusLine.classList.toggle("typing", on);
    if (on) scrollDown();
  }

  async function sendMessage(text) {
    text = text.trim();
    if (!text || busy) return;
    busy = true;
    send.disabled = true;
    suggestions.style.display = "none";
    input.value = "";
    const mine = addMessage(text, "out");
    setTimeout(() => setTyping(true), 350);
    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: session, message: text }),
      });
      const data = await response.json();
      mine.querySelector(".ticks")?.classList.add("read");
      (data.tool_calls || []).forEach(addTool);
      setTyping(false);
      addMessage(data.text || data.error || "Não consegui responder agora.", "in");
      if (data.model) modelLabel.textContent = `modelo: ${data.model}`;
    } catch (error) {
      setTyping(false);
      addMessage("Sem conexão com o servidor. Ele está rodando?", "in");
    } finally {
      busy = false;
      send.disabled = false;
      input.focus();
    }
  }

  document.getElementById("composer").addEventListener("submit", event => {
    event.preventDefault();
    sendMessage(input.value);
  });
  suggestions.addEventListener("click", event => {
    if (event.target.tagName === "BUTTON") sendMessage(event.target.textContent);
  });
  document.getElementById("show-tools").addEventListener("change", event => {
    document.getElementById("screen").classList.toggle("show-tools", event.target.checked);
    scrollDown();
  });
  document.getElementById("reset").addEventListener("click", async () => {
    await fetch("/api/reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: session }),
    });
    session = newSession();
    chat.querySelectorAll(".msg, .tool").forEach(node => node.remove());
    suggestions.style.display = "";
    modelLabel.textContent = "";
    input.focus();
  });
  input.focus();
</script>
</body>
</html>
